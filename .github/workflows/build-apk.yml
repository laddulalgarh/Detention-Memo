name: Detention Memo APK Build

on:
workflow_dispatch:
push:
paths:
- 'Detention_Memo_DATE_TIME_CALC.zip'
- '.github/workflows/build-apk.yml'

permissions:
contents: read

jobs:
build:
runs-on: ubuntu-latest

steps:
  - name: Checkout Repository
    uses: actions/checkout@v4

  - name: Check ZIP File
    run: |
      if [ ! -f "Detention_Memo_DATE_TIME_CALC.zip" ]; then
        echo "ERROR: Detention_Memo_DATE_TIME_CALC.zip not found in repository root."
        exit 1
      fi

  - name: Extract Android Project
    run: |
      unzip -o Detention_Memo_DATE_TIME_CALC.zip

  - name: Set Up Java
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '17'

  - name: Set Up Gradle
    uses: gradle/actions/setup-gradle@v4

  - name: Build Debug APK
    run: |
      if [ -f "./gradlew" ]; then
        chmod +x ./gradlew
        ./gradlew assembleDebug
      else
        gradle assembleDebug
      fi

  - name: Upload APK
    uses: actions/upload-artifact@v4
    with:
      name: Detention-Memo-APK
      path: '**/build/outputs/apk/debug/*.apk'
      if-no-files-found: error
      retention-days: 7
