name: Detention Memo APK Build

on: [push, workflow_dispatch]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set Up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify ZIP
        run: |
          if [ ! -f "Detention_Memo_DATE_TIME_CALC.zip" ]; then
            echo "ERROR: ZIP not found in repository root"
            ls -la
            exit 1
          fi

      - name: Extract Android Project
        run: |
          unzip -o Detention_Memo_DATE_TIME_CALC.zip -d extracted
          echo "Extract complete"
          find extracted -maxdepth 4 -type f \( -name "settings.gradle" -o -name "settings.gradle.kts" -o -name "gradlew" \)

      - name: Find Project and Build APK
        run: |
          set -eu

          PROJECT_DIR=""

          while IFS= read -r file; do
            dir="$(dirname "$file")"
            if [ -f "$dir/build.gradle" ] || [ -f "$dir/build.gradle.kts" ]; then
              PROJECT_DIR="$dir"
              break
            fi
          done < <(find extracted -type f \( -name "settings.gradle" -o -name "settings.gradle.kts" \))

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Gradle settings file not found"
            find extracted -maxdepth 5 -type f
            exit 1
          fi

          echo "Project directory: $PROJECT_DIR"
          cd "$PROJECT_DIR"

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug
          else
            echo "Gradle wrapper missing; trying installed Gradle"
            gradle assembleDebug
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Detention-Memo-APK
          path: extracted/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
